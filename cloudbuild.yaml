# cloudbuild.yaml

steps:
  - name: "gcr.io/cloud-builders/docker"
    args: [ "build", "-t", "gcr.io/bolgzenai/blogzenai-api:latest", "." ]

  - name: "gcr.io/cloud-builders/docker"
    args: [ "push", "gcr.io/bolgzenai/blogzenai-api:latest" ]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "blogzenai-api"
      - "--image=gcr.io/bolgzenai/blogzenai-api:latest"
      - "--region=asia-south1"
      - "--platform=managed"

images:
  - "gcr.io/bolgzenai/blogzenai-api:latest"

options:
  logging: CLOUD_LOGGING_ONLY
