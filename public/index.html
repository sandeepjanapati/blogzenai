<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogZenAI - Your AI Writing Assistant</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Our Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Markdown Renderer Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>

    <!-- Firebase SDKs (Load these early) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>BlogZenAI 🚀</h1>
            <p>Generate high-quality blog posts in seconds.</p>
            <!-- Login/Logout controls will go here -->
            <div id="auth-container">
                <button id="login-btn" style="display: none;">Sign in with Google</button>
                <div id="user-info" style="display: none;">
                    <p id="user-display"></p>
                    <button id="logout-btn">Sign Out</button>
                </div>
            </div>
        </header>

        <main>
            <div class="grid-container">
                <section class="generator-card card">
                    <h2>Create New Content</h2>
                    <form id="blog-form">
                        <div class="form-group">
                            <label for="topic">Blog Topic</label>
                            <input type="text" id="topic" placeholder="e.g., The Future of Renewable Energy" required>
                        </div>
                        <div class="form-group">
                            <label for="tone">Writing Tone</label>
                            <input type="text" id="tone" placeholder="e.g., Professional, witty, educational">
                        </div>
                        <button type="submit" id="generate-btn">
                            <span class="btn-text">Generate Article</span>
                            <span class="loader" style="display: none;"></span>
                        </button>
                    </form>
                </section>

                <section class="history-card card">
                    <h2>Recent History</h2>
                    <ul id="history-list">
                        <li class="placeholder">Your recent generations will appear here.</li>
                    </ul>
                </section>
            </div>

            <section class="results-card card" id="results-section" style="display: none;">
                <h2>Generated Article</h2>
                <article id="blog-output">
                    <!-- JS will populate this with formatted HTML -->
                </article>
            </section>
        </main>
        
        <footer>
            <p>&copy; Copyright 2025 BlogZenAI</p>
        </footer>
    </div>
    <script src="script.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</body>
</html>
